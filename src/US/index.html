			const setUserWon = value => {
				try {
					const currentPath = window.location.pathname;
					document.cookie = `userWon=${value}; path=${currentPath}`;
				} catch (error) {
					console.error('Set userWon error: ', error);
				}
			};

			const getUserWon = () => {
				try {
					const matches = document.cookie.match(new RegExp('(^| )userWon=([^;]+)'));
					return matches ? Number(matches[2]) : 0;
				} catch (error) {
					console.error('Get userWon error: ', error);
					return 0; // not null because (null >= 0) is true
				}
			};

			let chosenProd = '';

		</script>
